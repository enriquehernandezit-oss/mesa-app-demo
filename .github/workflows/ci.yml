name: CI

# Every push and PR gets the same checks the founder runs by hand:
# typecheck → lint → format → test (against a real Postgres) → the Metro bundle actually builds.
#
# Two installs, deliberately: apps/mobile is NOT a workspace member (it needs a
# flat node_modules for Metro — see its bunfig.toml linker="hoisted"), so the
# root `bun install` does not reach it and root `--filter '*'` scripts skip it.
# Checking the mobile app therefore takes its own install + its own tsc.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · db (typecheck, lint, format, test)
    runs-on: ubuntu-latest

    # A throwaway Postgres for the route tests. Fourteen-plus of them talk to a real database and
    # SKIP themselves when none is reachable, so without this service CI stayed green while checking
    # nothing about privacy, moderation or ranking order. The tests only run against a localhost
    # URL (see the gate at the top of any *.test.ts that opens a pool), which is exactly this one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesa
          POSTGRES_PASSWORD: mesa
          POSTGRES_DB: mesa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesa -d mesa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://mesa:mesa@localhost:5432/mesa_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (workspace root — apps/api + packages/db)
        run: bun install --frozen-lockfile

      # Covers apps/api and packages/db. Not apps/mobile (see header).
      - name: Typecheck
        run: bun run --filter '*' typecheck

      # oxlint runs over the whole repo from root, so this DOES cover
      # apps/mobile's source even though its deps aren't installed here.
      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      # The same migrations production runs on every deploy, applied to the empty service database.
      - name: Migrate
        run: bun run db:migrate

      - name: Test
        run: bun run --filter '*' test

  mobile:
    name: Mobile (typecheck, test, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (standalone, hoisted linker)
        working-directory: apps/mobile
        run: bun install --frozen-lockfile

      # Catches internal type errors and any drift where a screen uses a field
      # src/lib/types.ts doesn't declare. It does NOT prove the hand-mirrored
      # types still match the API's real responses — nothing does, by design
      # (codegen was rejected as accidental complexity). Treat a schema change
      # as a manual prompt to update src/lib/types.ts.
      - name: Typecheck
        working-directory: apps/mobile
        run: bunx tsc --noEmit

      - name: Test
        working-directory: apps/mobile
        run: bun run test

      # The check tsc cannot do: an unknown NativeWind class or an import Metro
      # can't resolve fails silently in tsc but breaks the bundle. No Xcode
      # needed — this is a JS bundle, so it runs fine on Linux.
      - name: Bundle (expo export)
        working-directory: apps/mobile
        run: bunx expo export --platform ios
